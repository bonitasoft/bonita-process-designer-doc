name: Push content

on:
  workflow_dispatch:
  push:
    branches:
      - '[0-9].[0-9]' # generic pattern for release branches like 1.3, 1.4
    paths:
      - 'modules/**'
      - 'antora.yml'
      - '.github/workflows/push-content.yml'

jobs:
  triggerJob:
    uses: bonitasoft/bonita-documentation-site/.github/workflows/_reusable_notify_content_change.yml@master
    secrets: inherit
    with:
        component: process-designer
