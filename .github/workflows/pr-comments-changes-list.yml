name: Comments PR with changes list

on:
  pull_request_target:
    paths:
      - '.github/workflows/pr-comments-changes-list.yml'
      - 'modules/**'

jobs:
  commentsPRChanges:
    permissions:
      pull-requests: write # write PR comments
    uses: bonitasoft/bonita-documentation-site/.github/workflows/_reusable_pr-comment-list-changes.yml@chore/init-process-designer
    secrets: inherit
    with:
      component-name: process-designer
